name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > notebox-release.jks
      - name: Build Release
        env:
          NOT_EBOX_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          NOT_EBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NOT_EBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NoteBox-release
          path: app/build/outputs/apk/release/*.apk
